<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大人，就等你了</title>
<style>
  :root {
    --bg: #ede4d3;
    --paper: #faf6ee;
    --paper2: #fffdf8;
    --navy: #2e3350;
    --navy2: #3a3f5c;
    --gold: #c9a227;
    --gold-light: #e8d9a8;
    --red: #b03a2e;
    --red-light: #d9534f;
    --text: #3a2e24;
    --text-dim: #8a7a66;
    --line: #c9b896;
    --line-light: #e0d4bc;
    --purple: #7a5a9a;
    --blue: #4a6a8a;
    --green: #5a8a5a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 16px;
  }
  .sheet {
    max-width: 1100px;
    margin: 0 auto;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 8px;
    box-shadow: 0 4px 20px rgba(58,46,36,0.12);
    overflow: hidden;
  }
  .title-bar {
    background: linear-gradient(180deg, var(--navy), var(--navy2));
    padding: 14px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 3px solid var(--gold);
  }
  .title-bar h1 {
    color: var(--gold-light);
    font-size: 20px;
    letter-spacing: 4px;
    font-weight: 600;
  }
  .title-bar button {
    background: transparent;
    border: 1px solid var(--gold);
    color: var(--gold-light);
    padding: 5px 14px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 12px;
    letter-spacing: 1px;
  }
  .title-bar button:hover { background: var(--gold); color: var(--navy); }

  /* 页面切换 */
  .page { display: none; }
  .page.active { display: block; }

  /* 月历 */
  .calendar-section {
    padding: 12px 16px;
    border-bottom: 2px solid var(--line);
    background: var(--paper2);
  }
  .calendar-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .calendar-header .month-title {
    font-size: 18px;
    color: var(--navy);
    letter-spacing: 2px;
    font-weight: 600;
  }
  .calendar-header .nav { display: flex; gap: 6px; }
  .calendar-header button {
    background: var(--paper);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 3px 12px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 12px;
  }
  .calendar-header button:hover { border-color: var(--gold); color: var(--gold); }
  .month-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 2px;
    background: var(--line-light);
    border: 1px solid var(--line-light);
    border-radius: 4px;
    overflow: hidden;
  }
  .week-head {
    background: var(--navy);
    color: var(--gold-light);
    text-align: center;
    font-size: 13px;
    padding: 8px 0;
    letter-spacing: 1px;
  }
  .day-cell {
    background: var(--paper);
    min-height: 88px;
    padding: 5px;
    cursor: pointer;
    transition: background 0.15s;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .day-cell:hover { background: rgba(201,162,39,0.08); }
  .day-cell.other-month { background: var(--bg); opacity: 0.5; }
  .day-cell.today { background: rgba(201,162,39,0.15); }
  .day-cell.selected { outline: 2px solid var(--gold); outline-offset: -2px; }
  .day-cell.scroll-day { background: rgba(176,58,46,0.06); }
  .day-cell .date-num {
    font-size: 14px;
    color: var(--text);
    font-weight: 600;
    align-self: flex-start;
  }
  .day-cell.today .date-num { color: var(--red); }
  .event-chip {
    font-size: 11px;
    padding: 2px 6px;
    border-radius: 3px;
    line-height: 1.3;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .event-chip.gold { background: #fdf8e8; color: #8a6a10; border-left: 3px solid var(--gold); }
  .event-chip.red { background: #fdf0ee; color: var(--red); border-left: 3px solid var(--red); }
  .event-chip.purple { background: #f6f0fa; color: var(--purple); border-left: 3px solid var(--purple); }
  .event-chip.blue { background: #eef4f8; color: var(--blue); border-left: 3px solid var(--blue); }
  .event-chip.green { background: #eef6ee; color: var(--green); border-left: 3px solid var(--green); }

  /* 任务区 */
  .selected-section {
    padding: 14px 20px;
    border-bottom: 2px solid var(--line);
    background: var(--paper);
  }
  .selected-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .selected-head h2 {
    font-size: 15px;
    color: var(--navy);
    letter-spacing: 1px;
  }
  .selected-head .badge {
    font-size: 12px;
    padding: 2px 10px;
    border-radius: 10px;
    border: 1px solid var(--line);
    color: var(--text-dim);
  }
  .badge.scroll { color: var(--red); border-color: var(--red); background: #fdf0ee; }

  .time-block { margin-bottom: 14px; }
  .time-block:last-child { margin-bottom: 0; }
  .time-title {
    font-size: 14px;
    color: var(--navy);
    letter-spacing: 2px;
    margin-bottom: 6px;
    padding-left: 8px;
    border-left: 4px solid transparent;
  }
  .time-title.active {
    color: var(--gold);
    border-left-color: var(--gold);
    font-weight: 700;
  }
  .time-title.scroll-title {
    color: var(--red);
    border-left-color: var(--red);
    font-weight: 700;
  }

  .task-list { display: flex; flex-direction: column; gap: 4px; }
  .task-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    border: 1px solid var(--line-light);
    border-radius: 4px;
    background: var(--paper2);
    cursor: pointer;
    font-size: 13px;
  }
  .task-row:hover { border-color: var(--gold); }
  .task-row .box {
    width: 15px;
    height: 15px;
    border: 1px solid var(--line);
    border-radius: 3px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    color: transparent;
    background: var(--paper);
    flex-shrink: 0;
  }
  .task-row.done .box { background: var(--gold); border-color: var(--gold); color: #fff; }
  .task-row.done .text { text-decoration: line-through; color: var(--text-dim); }
  .task-row .text { flex: 1; }
  .task-row.high-priority {
    background: #fdf0ee;
    border-color: var(--red);
    font-weight: 700;
    color: var(--red);
  }

  /* 信息区 */
  .info-section {
    padding: 14px 20px;
    background: var(--paper);
    border-bottom: 2px solid var(--line);
  }
  .info-row {
    display: flex;
    align-items: center;
    margin-bottom: 8px;
  }
  .info-row:last-child { margin-bottom: 0; }
  .info-label {
    background: var(--red);
    color: #fff;
    font-size: 12px;
    padding: 3px 10px;
    border-radius: 4px;
    letter-spacing: 1px;
    white-space: nowrap;
    margin-right: 10px;
    min-width: 90px;
    text-align: center;
  }
  .info-label.navy { background: var(--navy); }
  .info-label.gold { background: var(--gold); color: #fff; }
  .info-value {
    flex: 1;
    font-size: 13px;
    color: var(--text);
    padding: 4px 6px;
    border-bottom: 1px dashed var(--line);
    min-height: 26px;
  }
  .info-value.empty { color: var(--text-dim); font-style: italic; }

  .footer {
    text-align: center;
    padding: 10px;
    font-size: 11px;
    color: var(--text-dim);
    background: var(--paper2);
    border-top: 1px solid var(--line-light);
  }

  /* 设置页 */
  .settings-section {
    padding: 16px 20px;
    border-bottom: 2px solid var(--line);
  }
  .settings-section h2 {
    font-size: 15px;
    color: var(--navy);
    letter-spacing: 2px;
    margin-bottom: 10px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--line-light);
  }
  .form-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
    margin-bottom: 10px;
  }
  .form-row input, .form-row select {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 6px 10px;
    font-size: 13px;
    color: var(--text);
    outline: none;
    font-family: inherit;
  }
  .form-row input:focus, .form-row select:focus { border-color: var(--gold); }
  .form-row input[type="text"] { flex: 1; min-width: 160px; }
  .form-row button {
    background: var(--navy);
    color: var(--gold-light);
    border: none;
    padding: 6px 16px;
    border-radius: 4px;
    font-size: 13px;
    cursor: pointer;
    letter-spacing: 1px;
  }
  .form-row button:hover { background: var(--navy2); }

  .item-list { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  .item-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 10px;
    border: 1px solid var(--line-light);
    border-radius: 4px;
    background: var(--paper2);
    font-size: 13px;
  }
  .item-row .meta { color: var(--text-dim); font-size: 11px; margin-left: 8px; }
  .item-row .del {
    color: var(--text-dim);
    cursor: pointer;
    font-size: 14px;
    padding: 0 4px;
  }
  .item-row .del:hover { color: var(--red); }

  @media (max-width: 640px) {
    .title-bar h1 { font-size: 14px; letter-spacing: 2px; }
    .day-cell { min-height: 70px; }
    .event-chip { font-size: 10px; }
    .info-label { min-width: 70px; font-size: 11px; }
  }
#backToTop {
  position: fixed;
  right: 24px;
  bottom: 24px;
  width: 44px;
  height: 44px;
  border: 1px solid var(--line);
  border-radius: 50%;
  background: var(--paper2);
  color: var(--navy);
  font-size: 20px;
  font-weight: 700;
  line-height: 1;
  cursor: pointer;
  padding: 0;
  box-shadow: 0 2px 8px rgba(58,46,36,0.12);
  transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s, color 0.15s;
  z-index: 999;
  display: none;
  opacity: 0.9;
}
#backToTop:hover {
  transform: translateY(-2px);
  border-color: var(--gold);
  color: var(--gold);
  box-shadow: 0 4px 12px rgba(58,46,36,0.2);
  opacity: 1;
}
.home-events {
  margin-bottom: 12px;
  padding-bottom: 10px;
  border-bottom: 1px dashed var(--line);
}
.home-event-item {
  font-size: 13px;
  color: var(--blue);
  padding: 3px 0;
}
.home-event-item .label {
  color: var(--navy);
  font-weight: 600;
  margin-right: 6px;
}
.checkbox-group {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  align-items: center;
}
.checkbox-group label {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 13px;
  cursor: pointer;
}
.checkbox-group input[type="checkbox"] {
  width: 15px;
  height: 15px;
  accent-color: var(--gold);
}
.toggle-group { margin-bottom: 12px; }
.toggle-group-title {
  font-size: 13px;
  color: var(--navy);
  font-weight: 600;
  margin-bottom: 6px;
}
.toggle-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 4px 8px;
  font-size: 12px;
  border-bottom: 1px dashed var(--line-light);
}
.toggle-item:last-child { border-bottom: none; }
.toggle-item input[type="checkbox"] {
  width: 15px;
  height: 15px;
  accent-color: var(--gold);
}
.toggle-item label { flex: 1; cursor: pointer; }
.collapsible-title {
  cursor: pointer;
  user-select: none;
  display: flex;
  align-items: center;
  gap: 8px;
}
.collapsible-title .arrow {
  font-size: 12px;
  color: var(--gold);
  transition: transform 0.15s;
  display: inline-block;
}
.collapsible-title .arrow.open {
  transform: rotate(90deg);
}


  /* ================= 手机适配 ================= */
@media (max-width: 768px) {
  body { padding: 8px; }

  .sheet { border-radius: 6px; }

  /* 标题栏 */
  .title-bar { padding: 10px 12px; }
  .title-bar h1 { font-size: 14px; letter-spacing: 1px; }
  .title-bar button { padding: 4px 10px; font-size: 11px; }

  /* 月历 */
  .calendar-section { padding: 8px 10px; }
  .calendar-header .month-title { font-size: 15px; }
  .calendar-header button { padding: 2px 8px; font-size: 11px; }
  .week-head { font-size: 11px; padding: 5px 0; }
  .day-cell { min-height: 56px; padding: 3px; gap: 2px; }
  .day-cell .date-num { font-size: 12px; }
  .event-chip { font-size: 9px; padding: 1px 3px; }

  /* 任务区 */
  .selected-section { padding: 10px 12px; }
  .selected-head h2 { font-size: 13px; }
  .selected-head .badge { font-size: 11px; padding: 1px 8px; }
  .time-title { font-size: 13px; }
  .task-row { font-size: 12px; padding: 6px 8px; gap: 6px; }
  .task-row .box { width: 14px; height: 14px; font-size: 9px; }

  /* 信息区 */
  .info-section { padding: 10px 12px; }
  .info-row { flex-wrap: wrap; gap: 4px; }
  .info-label {
    font-size: 11px;
    padding: 2px 6px;
    min-width: 60px;
    margin-right: 6px;
  }
  .info-value { font-size: 12px; padding: 3px 4px; }

  /* 设置页 */
  .settings-section { padding: 12px; }
  .settings-section h2 { font-size: 14px; }
  .form-row { gap: 6px; margin-bottom: 8px; }
  .form-row input, .form-row select {
    font-size: 12px;
    padding: 5px 8px;
  }
  .form-row input[type="text"] { min-width: 100%; flex: 1 1 100%; }
  .form-row input[type="date"] { flex: 1 1 45%; }
  .form-row input[type="time"] { flex: 1 1 45%; }
  .form-row input[type="number"] { flex: 1 1 45%; }
  .form-row select { flex: 1 1 100%; }
  .form-row button { flex: 1 1 100%; padding: 6px 12px; font-size: 12px; }
  .form-row .info-label { flex: 1 1 100%; margin-bottom: 4px; text-align: left; }

  .item-row { font-size: 12px; padding: 6px 8px; flex-wrap: wrap; gap: 4px; }
  .item-row .meta { font-size: 10px; }

  /* 回到顶部 */
  #backToTop {
    width: 40px;
    height: 40px;
    font-size: 18px;
    right: 16px;
    bottom: 16px;
  }
}

/* 超小屏（比如 375px 以下） */
@media (max-width: 400px) {
  .title-bar h1 { font-size: 12px; letter-spacing: 0; }
  .day-cell { min-height: 48px; }
  .event-chip { font-size: 8px; }
  .task-row { font-size: 11px; }
  .info-label { font-size: 10px; min-width: 52px; }
}
@media (max-width: 768px) {
  .calendar-section {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  .month-grid {
    min-width: 640px;   /* 保证七天排得下，超出的部分横向滚动 */
  }
  .day-cell {
    min-height: 70px;
  }
  .event-chip {
    font-size: 9px;
  }
}
</style>
</head>
<body>

<div class="sheet">

  <div class="title-bar">
    <h1>阴阳师养成</h1>
    <div>
      <button id="btnHome" onclick="showPage('home')" style="display:none;">返回首页</button>
      <button id="btnSettings" onclick="showPage('settings')">⚙ 设置</button>
    </div>
  </div>

  <!-- ========== 首页 ========== -->
  <div class="page active" id="page-home">

    <div class="calendar-section">
      <div class="calendar-header">
        <div class="month-title" id="monthTitle">2026年 10月</div>
        <div class="nav">
          <button onclick="changeMonth(-1)">← 上月</button>
          <button onclick="goToday()">今天</button>
          <button onclick="changeMonth(1)">下月 →</button>
        </div>
      </div>
      <div class="month-grid" id="monthGrid"></div>
    </div>

    <div class="selected-section">
      <div class="selected-head">
        <h2 id="selectedTitle">今日任务</h2>
        <span class="badge" id="selectedBadge">非绘卷期</span>
      </div>
      <div id="taskContainer"></div>
    </div>

    <div class="info-section" id="infoSection"></div>

    <div class="footer">数据保存在本地浏览器 · 清缓存会丢失</div>
  </div>

  <!-- ========== 设置页 ========== -->
  <div class="page" id="page-settings">

    <div class="settings-section">
      <h2>活动管理</h2>
      <div class="form-row">
        <input type="text" id="eventName" placeholder="活动名称">
        <input type="date" id="eventStart">
        <input type="date" id="eventEnd">
        <select id="eventColor">
          <option value="gold">金色（卡池）</option>
          <option value="red">红色（绘卷）</option>
          <option value="purple">紫色（联动）</option>
          <option value="blue">蓝色（活动）</option>
        </select>
        <button onclick="addEvent()">添加</button>
      </div>
      <div class="item-list" id="eventList"></div>
    </div>

    <div class="settings-section">
      <h2>绘卷期管理</h2>
      <div class="form-row">
        <input type="date" id="scrollStart">
        <select id="scrollDays">
          <option value="1">1天</option>
          <option value="2">2天</option>
          <option value="3">3天</option>
        </select>
        <button onclick="addScroll()">添加</button>
      </div>
      <div class="item-list" id="scrollList"></div>
    </div>

    <div class="settings-section">
  <h2>自定义任务</h2>
  <div class="form-row">
    <input type="text" id="customText" placeholder="任务内容">
    <input type="date" id="customDate">
    <select id="customPriority">
      <option value="必做">必做</option>
      <option value="可选">可选</option>
      <option value="最高">最高</option>
    </select>
  </div>
  <div class="form-row">
    <span style="font-size:12px;color:var(--text-dim);">时段：</span>
    <div class="checkbox-group">
      <label><input type="checkbox" id="slotMorning" value="morning"> 早上</label>
      <label><input type="checkbox" id="slotAfternoon" value="afternoon"> 下午</label>
      <label><input type="checkbox" id="slotEvening" value="evening"> 晚上</label>
    </div>
    <button onclick="addCustom()">添加</button>
  </div>
  <div class="item-list" id="customList"></div>
</div>

    <div class="settings-section">
      <h2>自定义寮活动</h2>
      <div class="form-row">
        <select id="liaoDay">
          <option value="5">周五</option>
          <option value="6">周六</option>
          <option value="0">周日</option>
          <option value="1">周一</option>
          <option value="2">周二</option>
          <option value="3">周三</option>
          <option value="4">周四</option>
        </select>
        <input type="time" id="liaoTime" value="19:30">
        <input type="text" id="liaoText" placeholder="内容，如：狭间暗域">
        <button onclick="addLiao()">添加</button>
      </div>
      <div class="item-list" id="liaoList"></div>
    </div>

<div class="settings-section">
  <h2>信息区内容</h2>
  <div class="form-row">
    <span class="info-label navy">排期记录</span>
    <input type="text" id="setLong" placeholder="排期记录" style="flex:1;">
  </div>
  <div class="form-row">
    <span class="info-label gold">抽卡规划</span>
    <input type="text" id="setGacha" placeholder="抽卡规划" style="flex:1;">
  </div>
  <div class="form-row">
    <span class="info-label gold">养成计划</span>
    <input type="text" id="setGrow" placeholder="养成计划" style="flex:1;">
  </div>
  <div class="form-row">
    <span class="info-label navy">礼包屋倒计时</span>
    <input type="number" id="setGiftDays" placeholder="还有几天" style="width:100px;">
    <span style="font-size:12px;color:var(--text-dim);">天</span>
    <button onclick="saveInfo()">保存</button>
  </div>
</div>

<div class="settings-section">
  <h2 class="collapsible-title" onclick="toggleTaskPanel()">
    <span class="arrow" id="taskPanelArrow">▶</span>
    常用日常任务显示设置
  </h2>
  <div id="taskTogglePanel" style="display:none;">
    <div id="taskToggleContainer"></div>
    <div class="form-row" style="margin-top:10px;">
      <button onclick="saveTaskVisible()">保存显示设置</button>
    </div>
  </div>
</div>

<div class="footer">设置完成后返回首页查看效果</div>
  </div>

</div>

<script>
/* ================= 状态 ================= */
function loadState() {
  try {
    const raw = localStorage.getItem("yys_checkin_v6");
    if (raw) {
      const s = JSON.parse(raw);
      if (!s.weeklyChecks) s.weeklyChecks = {};
      if (!s.checks) s.checks = {};
      if (!s.customs) s.customs = [];

/* ================= 工具 ================= */
function pad(n){ return String(n).padStart(2,"0"); }
function dateStr(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function todayStr(){ return dateStr(new Date()); }
function parseDate(s){ return new Date(s + "T00:00:00"); }
function addDays(s, n){ const d = parseDate(s); d.setDate(d.getDate()+n); return dateStr(d); }
function diffDays(a, b){ return Math.floor((parseDate(b) - parseDate(a)) / 86400000); }
function formatDay(ds) {
  const d = parseDate(ds);
  return `${d.getMonth()+1}.${d.getDate()} 周${["日","一","二","三","四","五","六"][d.getDay()]}`;
}
function getWeekday(ds) { return parseDate(ds).getDay(); }
function getWeekStart(ds) {
  const d = parseDate(ds);
  const day = d.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  d.setDate(d.getDate() + diff);
  return dateStr(d);
}

function isScrollDay(ds) {
  return state.scrolls.some(s => {
    const diff = diffDays(s.start, ds);
    return diff >= 0 && diff < s.days;
  });
}
function formatDateDot(ds) {          
  const d = parseDate(ds);
  return `${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())}`;
}

/* ================= 月历 ================= */
let currentMonth = new Date();
let selectedDate = todayStr();

function renderCalendar() {
  const grid = document.getElementById("monthGrid");
  grid.innerHTML = "";
  const year = currentMonth.getFullYear();
  const month = currentMonth.getMonth();
  document.getElementById("monthTitle").textContent = `${year}年 ${month+1}月`;

  ["日","一","二","三","四","五","六"].forEach(w => {
    const h = document.createElement("div");
    h.className = "week-head";
    h.textContent = w;
    grid.appendChild(h);
  });

  const firstDay = new Date(year, month, 1);
  const startDay = firstDay.getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const prevMonthDays = new Date(year, month, 0).getDate();
  const totalCells = Math.ceil((startDay + daysInMonth) / 7) * 7;

  for (let i = 0; i < totalCells; i++) {
    const cell = document.createElement("div");
    cell.className = "day-cell";
    let dayNum, ds, isOther = false;

    if (i < startDay) {
      dayNum = prevMonthDays - startDay + i + 1;
      ds = dateStr(new Date(year, month - 1, dayNum));
      isOther = true;
      cell.classList.add("other-month");
    } else if (i >= startDay + daysInMonth) {
      dayNum = i - startDay - daysInMonth + 1;
      ds = dateStr(new Date(year, month + 1, dayNum));
      isOther = true;
      cell.classList.add("other-month");
    } else {
      dayNum = i - startDay + 1;
      ds = dateStr(new Date(year, month, dayNum));
    }

    if (ds === todayStr()) cell.classList.add("today");
    if (ds === selectedDate) cell.classList.add("selected");
    if (isScrollDay(ds)) cell.classList.add("scroll-day");

    const numEl = document.createElement("div");
    numEl.className = "date-num";
    numEl.textContent = dayNum;
    cell.appendChild(numEl);

    // 活动渲染
    state.events.forEach(e => {
      if (ds >= e.start && ds <= e.end) {
        const chip = document.createElement("div");
        chip.className = "event-chip " + (e.color || "gold");
        chip.textContent = e.name;
        cell.appendChild(chip);
      }
    });

    cell.onclick = () => {
      selectedDate = ds;
      renderCalendar();
      renderTasks();
    };
    grid.appendChild(cell);
  }
}

function changeMonth(dir) { currentMonth.setMonth(currentMonth.getMonth() + dir); renderCalendar(); }

function buildTimeBlock(title, tasks, ds, active, type) {
  const block = document.createElement("div");
  block.className = "time-block";
  const titleEl = document.createElement("div");
  titleEl.className = "time-title" + (active ? " active" : "") + (type === "scroll" ? " scroll-title" : "");
  titleEl.textContent = `【${title}】`;
  block.appendChild(titleEl);

  const list = document.createElement("div");
  list.className = "task-list";

  tasks.forEach(t => {
    let key, done;
    if (title === "每周任务") {
      if (!state.weeklyChecks) state.weeklyChecks = {};
      key = getWeekStart(ds) + "|" + t.text;
      done = state.weeklyChecks[key] || false;
    } else {
      key = ds + "|" + title + "|" + t.text;
      done = state.checks[key] || false;
    }
    const row = document.createElement("div");
    row.className = "task-row" + (done ? " done" : "") + (t.high ? " high-priority" : "");
    row.innerHTML = `
      <div class="box">✓</div>
      <div class="text">${t.text}</div>
    `;
    row.onclick = () => {
      if (title === "每周任务") {
        state.weeklyChecks[key] = !state.weeklyChecks[key];
      } else {
        state.checks[key] = !state.checks[key];
      }
      saveState();
      renderTasks();
    };
    list.appendChild(row);
  });

  block.appendChild(list);
  return block;
}

  html += `</div>`;

  // 晚上
  html += `<div class="toggle-group"><div class="toggle-group-title">晚上</div>`;
  all.evening.forEach(t => {
    const id = "tv_evening_" + t.text;
    const checked = state.taskVisible.evening[t.text] ? "checked" : "";
    html += `<div class="toggle-item"><input type="checkbox" id="${id}" data-group="evening" data-text="${t.text}" ${checked}><label for="${id}">${t.text}</label></div>`;
  });
  html += `</div>`;

  // 每周任务
html += `<div class="toggle-group"><div class="toggle-group-title">每周任务</div>`;
  const seen = new Set();
  Object.keys(all.weekly).forEach(day => {
    if (!all.weekly[day] || !all.weekly[day].length) return;
    all.weekly[day].forEach(t => {
      if (seen.has(t.text)) return;
      seen.add(t.text);
      // 用周一（day=1）的状态作为代表
      const refDay = "1";
      const checked = state.taskVisible.weekly[refDay] && state.taskVisible.weekly[refDay][t.text] ? "checked" : "";
      const id = "tv_weekly_" + t.text;
      html += `<div class="toggle-item"><input type="checkbox" id="${id}" data-group="weekly" data-text="${t.text}" ${checked}><label for="${id}">${t.text}</label></div>`;
    });
  });
  html += `</div>`;

  box.innerHTML = html;
}

function saveTaskVisible() {
  document.querySelectorAll("#taskToggleContainer input[type=checkbox]").forEach(cb => {
    const group = cb.dataset.group;
    const text = cb.dataset.text;
    if (group === "weekly") {
      // 每周任务：所有天的同一个任务都同步
      Object.keys(state.taskVisible.weekly).forEach(day => {
        state.taskVisible.weekly[day][text] = cb.checked;
      });
    } else {
      state.taskVisible[group][text] = cb.checked;
    }
  });
  saveState();
  alert("已保存显示设置");
}
function toggleTaskPanel() {
  const panel = document.getElementById("taskTogglePanel");
  const arrow = document.getElementById("taskPanelArrow");
  if (!panel) return;
  if (panel.style.display === "none") {
    panel.style.display = "block";
    arrow.classList.add("open");
  } else {
    panel.style.display = "none";
    arrow.classList.remove("open");
  }
}

</script>
<button id="backToTop" onclick="window.scrollTo({top:0,behavior:'smooth'})" title="回到顶部">↑</button>
</body>
</html>
